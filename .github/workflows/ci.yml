name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8787
      WXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      WXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
      WXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-twitch-friends.firebaseapp.com
      WXT_PUBLIC_FIREBASE_DATABASE_URL: https://demo-twitch-friends.europe-west1.firebasedatabase.app
      WXT_PUBLIC_FIREBASE_PROJECT_ID: demo-twitch-friends
      WXT_PUBLIC_FIREBASE_USE_EMULATORS: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version: 22
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run check
      - run: npm run test:rules
      - run: npm run worker:build
      - run: npm run build
      - run: npm run build:firefox
